name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # --log-opts="HEAD" scopes the scan to the pushed ref's history. Without it
      # gitleaks walks every ref in the clone, so an unrelated branch's findings
      # fail every unrelated PR.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
        with:
          args: detect --redact --no-banner --log-opts="HEAD"

  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Prisma's client is generated, not committed — the build needs it first.
      # A dummy URL is enough for `generate`; it never connects.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
