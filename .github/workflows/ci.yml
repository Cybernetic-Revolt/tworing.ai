name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # --log-opts="HEAD" scopes the scan to the pushed ref's history. Without it
      # gitleaks walks every ref in the clone, so an unrelated branch's findings
      # fail every unrelated PR.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
        with:
          args: detect --redact --no-banner --log-opts="HEAD"

  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The scaffold lands before the platform source does. Until package.json
      # exists there is nothing to build, and a job that is red from day one
      # trains everyone to ignore CI.
      - id: src
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"
               echo "::notice::No package.json yet — skipping build until the platform source is imported."
          fi
      - uses: actions/setup-node@v4
        if: steps.src.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
      - if: steps.src.outputs.present == 'true'
        run: npm ci
      # Prisma's client is generated, not committed — the build needs it first.
      # A dummy URL is enough for `generate`; it never connects.
      - if: steps.src.outputs.present == 'true'
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
      - if: steps.src.outputs.present == 'true'
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
