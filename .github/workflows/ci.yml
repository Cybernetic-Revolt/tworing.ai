name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret added and then "removed" in a later commit is
          # still in the history, and still leaked.
          fetch-depth: 0

      # Invoked directly rather than via gitleaks/gitleaks-action@v2. The action
      # builds its own command line and DISCARDS any `args:` you pass — it ran
      # `--log-opts=-1`, scanning a single commit, while reporting success. A
      # scanner that silently narrows its own scope is worse than none, because
      # the green check is what you end up trusting.
      #
      # --log-opts=HEAD scopes the scan to the ref under test. Without it gitleaks
      # walks every ref the fetch-depth:0 checkout brought down, so a finding on any
      # unmerged branch turns *every* push and PR red. The guard is not weakened:
      # each branch is pushed and scanned on its own, so a secret still fails CI —
      # on the branch that introduced it, which is the only branch that can fix it.
      - name: Scan this ref's history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --config /repo/.gitleaks.toml \
            --log-opts="HEAD" /repo

  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The scaffold lands before the platform source does. Until package.json
      # exists there is nothing to build, and a job that is red from day one
      # trains everyone to ignore CI.
      - id: src
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"
               echo "::notice::No package.json yet — skipping build until the platform source is imported."
          fi
      - uses: actions/setup-node@v4
        if: steps.src.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
      - if: steps.src.outputs.present == 'true'
        run: npm ci
      # Prisma's client is generated, not committed — the build needs it first.
      # A dummy URL is enough for `generate`; it never connects.
      - if: steps.src.outputs.present == 'true'
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
      - if: steps.src.outputs.present == 'true'
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
